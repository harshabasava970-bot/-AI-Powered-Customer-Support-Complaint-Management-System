services:
  - type: web
    name: ai-support-portal
    runtime: docker
    repo: https://github.com/harshabasava970-bot/-AI-Powered-Customer-Support-Complaint-Management-System
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_URL
        value: jdbc:h2:mem:supportdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      - key: DB_USERNAME
        value: sa
      - key: DB_PASSWORD
        value: ""
      - key: DB_DRIVER
        value: org.h2.Driver
      - key: DB_DIALECT
        value: org.hibernate.dialect.H2Dialect
    healthCheckPath: /login
    autoDeploy: true
