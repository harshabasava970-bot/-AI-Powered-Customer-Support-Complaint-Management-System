<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Users — Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/layout :: sidebar('users')}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('User Management')}"></div>
    <div class="page-body">
      <div th:replace="~{fragments/layout :: alerts}"></div>
      <div class="page-header"><h1>All Users</h1></div>

      <div class="card">
        <div class="card-body" style="padding:0">
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>ID</th><th>Name</th><th>Username</th><th>Email</th>
                    <th>Roles</th><th>Status</th><th>Joined</th><th>Action</th></tr>
              </thead>
              <tbody>
                <tr th:each="u : ${users}">
                  <td th:text="${u.id}"></td>
                  <td th:text="${u.fullName}"></td>
                  <td th:text="${u.username}"></td>
                  <td th:text="${u.email}"></td>
                  <td>
                    <span th:each="r : ${u.roles}" th:text="${r + ' '}"
                          style="font-size:.75rem;background:#e2e8f0;padding:.1rem .4rem;border-radius:4px;margin-right:.2rem"></span>
                  </td>
                  <td>
                    <span th:if="${u.enabled}"  class="badge badge-resolved">Active</span>
                    <span th:unless="${u.enabled}" class="badge badge-closed">Disabled</span>
                  </td>
                  <td th:text="${#temporals.format(u.createdAt,'dd MMM yyyy')}"></td>
                  <td>
                    <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}"
                          method="post" style="display:inline">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit"
                              th:class="${u.enabled ? 'btn btn-sm btn-warning' : 'btn btn-sm btn-success'}"
                              th:text="${u.enabled ? 'Disable' : 'Enable'}"
                              data-confirm="Toggle this user's status?"></button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
