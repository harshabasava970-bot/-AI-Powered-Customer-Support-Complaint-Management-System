<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Agents — Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/layout :: sidebar('agents')}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Agent Management')}"></div>
    <div class="page-body">
      <div th:replace="~{fragments/layout :: alerts}"></div>
      <div class="page-header"><h1>Support Agents</h1></div>

      <div style="display:grid;grid-template-columns:1fr 380px;gap:1.5rem;align-items:start">

        <!-- Agent list -->
        <div class="card">
          <div class="card-header"><h3>All Agents</h3></div>
          <div class="card-body" style="padding:0">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>Name</th><th>Email</th><th>Assigned</th>
                      <th>Resolved</th><th>Rating</th><th>Status</th></tr>
                </thead>
                <tbody>
                  <tr th:each="a : ${agents}">
                    <td th:text="${a.fullName}"></td>
                    <td th:text="${a.email}"></td>
                    <td>
                      <th:block th:with="stat=${agentStats.?[agentId == a.id][0]}">
                        <span th:if="${stat != null}" th:text="${stat.totalAssigned}">0</span>
                        <span th:unless="${stat != null}">0</span>
                      </th:block>
                    </td>
                    <td>
                      <th:block th:with="stat=${agentStats.?[agentId == a.id][0]}">
                        <span th:if="${stat != null}" th:text="${stat.resolved}">0</span>
                        <span th:unless="${stat != null}">0</span>
                      </th:block>
                    </td>
                    <td>
                      <th:block th:with="stat=${agentStats.?[agentId == a.id][0]}">
                        <span th:if="${stat != null and stat.averageRating != null}"
                              th:text="${stat.averageRating + ' ★'}">—</span>
                        <span th:unless="${stat != null and stat.averageRating != null}">—</span>
                      </th:block>
                    </td>
                    <td>
                      <span th:if="${a.enabled}"  class="badge badge-resolved">Active</span>
                      <span th:unless="${a.enabled}" class="badge badge-closed">Disabled</span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Create new agent -->
        <div class="card">
          <div class="card-header"><h3>Add New Agent</h3></div>
          <div class="card-body">
            <form th:action="@{/admin/agents}" method="post"
                  th:object="${registerRequest}">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <div class="form-group">
                <label class="form-label">First Name</label>
                <input th:field="*{firstName}" type="text" class="form-control"
                       th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''"/>
                <div class="invalid-feedback" th:errors="*{firstName}"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Last Name</label>
                <input th:field="*{lastName}" type="text" class="form-control"
                       th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''"/>
                <div class="invalid-feedback" th:errors="*{lastName}"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Username</label>
                <input th:field="*{username}" type="text" class="form-control"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"/>
                <div class="invalid-feedback" th:errors="*{username}"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Email</label>
                <input th:field="*{email}" type="email" class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"/>
                <div class="invalid-feedback" th:errors="*{email}"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Password</label>
                <input th:field="*{password}" type="password" class="form-control"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"/>
                <div class="invalid-feedback" th:errors="*{password}"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input th:field="*{confirmPassword}" type="password" class="form-control"/>
              </div>
              <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
                Create Agent
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
