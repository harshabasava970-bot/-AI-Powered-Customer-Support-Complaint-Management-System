<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>My Complaints — SupportPortal</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/layout :: sidebar('complaints')}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('My Complaints')}"></div>
    <div class="page-body">
      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="page-header">
        <h1>My Complaints</h1>
        <a th:href="@{/customer/complaints/new}" class="btn btn-primary">➕ New Complaint</a>
      </div>

      <div class="card">
        <div class="card-body" style="padding:0">
          <div th:if="${complaintsPage.totalElements == 0}"
               style="padding:2rem;text-align:center;color:#64748b">
            You have no complaints. <a th:href="@{/customer/complaints/new}">Submit one now</a>.
          </div>
          <div class="table-wrap" th:unless="${complaintsPage.totalElements == 0}">
            <table>
              <thead>
                <tr><th>#</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Agent</th><th>Date</th><th></th></tr>
              </thead>
              <tbody>
                <tr th:each="c : ${complaintsPage.content}">
                  <td th:text="${c.id}"></td>
                  <td><strong th:text="${c.title}"></strong></td>
                  <td th:text="${c.categoryName}"></td>
                  <td><span th:replace="~{fragments/layout :: priorityBadge(${c.priority})}"></span></td>
                  <td><span th:replace="~{fragments/layout :: statusBadge(${c.status})}"></span></td>
                  <td th:text="${c.assignedAgentName != null ? c.assignedAgentName : '—'}"></td>
                  <td th:text="${#temporals.format(c.createdAt,'dd MMM yyyy')}"></td>
                  <td><a th:href="@{/customer/complaints/{id}(id=${c.id})}" class="btn btn-sm btn-outline">View</a></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-footer" th:if="${complaintsPage.totalPages > 1}">
          <div class="pagination">
            <a th:if="${currentPage > 0}"
               th:href="@{/customer/complaints(page=${currentPage-1})}">‹ Prev</a>
            <span th:each="i : ${#numbers.sequence(0, complaintsPage.totalPages - 1)}"
                  th:classappend="${i == currentPage} ? 'active' : ''">
              <a th:href="@{/customer/complaints(page=${i})}" th:text="${i+1}"></a>
            </span>
            <a th:if="${currentPage < complaintsPage.totalPages - 1}"
               th:href="@{/customer/complaints(page=${currentPage+1})}">Next ›</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
