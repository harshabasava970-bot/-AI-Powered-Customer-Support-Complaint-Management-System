<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Complaint Detail — SupportPortal</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/layout :: sidebar('complaints')}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Complaint Details')}"></div>
    <div class="page-body">
      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="page-header">
        <div>
          <div class="breadcrumb">
            <a th:href="@{/customer/complaints}">My Complaints</a> ›
            <span th:text="'#' + ${complaint.id}"></span>
          </div>
          <h1 th:text="${complaint.title}">Complaint Title</h1>
        </div>
        <div style="display:flex;gap:.5rem;align-items:center">
          <span th:replace="~{fragments/layout :: statusBadge(${complaint.status})}"></span>
          <span th:replace="~{fragments/layout :: priorityBadge(${complaint.priority})}"></span>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 340px;gap:1.5rem;align-items:start">

        <!-- Left column -->
        <div style="display:flex;flex-direction:column;gap:1rem">

          <!-- Main details -->
          <div class="card">
            <div class="card-header"><h3>Complaint Information</h3></div>
            <div class="card-body">
              <dl style="display:grid;grid-template-columns:140px 1fr;gap:.5rem .75rem;font-size:.875rem">
                <dt style="color:#64748b;font-weight:600">ID</dt>
                <dd th:text="'#' + ${complaint.id}"></dd>
                <dt style="color:#64748b;font-weight:600">Category</dt>
                <dd th:text="${complaint.categoryName}"></dd>
                <dt style="color:#64748b;font-weight:600">Submitted</dt>
                <dd th:text="${#temporals.format(complaint.createdAt,'dd MMM yyyy, HH:mm')}"></dd>
                <dt style="color:#64748b;font-weight:600">Last Updated</dt>
                <dd th:text="${#temporals.format(complaint.updatedAt,'dd MMM yyyy, HH:mm')}"></dd>
                <dt style="color:#64748b;font-weight:600">Assigned Agent</dt>
                <dd th:text="${complaint.assignedAgentName != null ? complaint.assignedAgentName : 'Not yet assigned'}"></dd>
                <th:block th:if="${complaint.resolvedAt != null}">
                  <dt style="color:#64748b;font-weight:600">Resolved At</dt>
                  <dd th:text="${#temporals.format(complaint.resolvedAt,'dd MMM yyyy, HH:mm')}"></dd>
                </th:block>
              </dl>
              <hr style="margin:1rem 0"/>
              <h4 style="font-size:.85rem;font-weight:600;margin-bottom:.5rem">Description</h4>
              <p style="font-size:.875rem;white-space:pre-wrap" th:text="${complaint.description}"></p>
              <th:block th:if="${complaint.additionalInfo != null}">
                <h4 style="font-size:.85rem;font-weight:600;margin:.75rem 0 .4rem">Additional Information</h4>
                <p style="font-size:.875rem;white-space:pre-wrap" th:text="${complaint.additionalInfo}"></p>
              </th:block>
            </div>
          </div>

          <!-- Resolution notes -->
          <div class="card" th:if="${complaint.resolutionNotes != null}">
            <div class="card-header"><h3>✅ Resolution</h3></div>
            <div class="card-body">
              <p style="font-size:.875rem;white-space:pre-wrap" th:text="${complaint.resolutionNotes}"></p>
            </div>
          </div>

          <!-- Add more info (only if not closed) -->
          <div class="card"
               th:unless="${complaint.status.name() == 'CLOSED' or complaint.status.name() == 'RESOLVED'}">
            <div class="card-header"><h3>Add More Information</h3></div>
            <div class="card-body">
              <form th:action="@{/customer/complaints/{id}/additional-info(id=${complaint.id})}"
                    method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group">
                  <textarea name="additionalInfo" class="form-control" rows="3"
                            placeholder="Provide any additional context or updates..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-sm">Submit Update</button>
              </form>
            </div>
          </div>

          <!-- Feedback (only for resolved/closed complaints without existing feedback) -->
          <div class="card"
               th:if="${(complaint.status.name() == 'RESOLVED' or complaint.status.name() == 'CLOSED') and complaint.feedback == null}">
            <div class="card-header"><h3>⭐ Rate Your Experience</h3></div>
            <div class="card-body">
              <form th:action="@{/customer/complaints/{id}/feedback(id=${complaint.id})}"
                    method="post" th:object="${feedbackRequest}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group">
                  <label class="form-label">Rating</label>
                  <div class="star-rating">
                    <input type="radio" id="s5" th:field="*{rating}" value="5"/>
                    <label for="s5">★</label>
                    <input type="radio" id="s4" th:field="*{rating}" value="4"/>
                    <label for="s4">★</label>
                    <input type="radio" id="s3" th:field="*{rating}" value="3"/>
                    <label for="s3">★</label>
                    <input type="radio" id="s2" th:field="*{rating}" value="2"/>
                    <label for="s2">★</label>
                    <input type="radio" id="s1" th:field="*{rating}" value="1"/>
                    <label for="s1">★</label>
                  </div>
                  <div class="invalid-feedback" th:errors="*{rating}"></div>
                </div>
                <div class="form-group">
                  <label class="form-label">Comment (optional)</label>
                  <textarea th:field="*{comment}" class="form-control" rows="3"
                            placeholder="Tell us about your experience..."></textarea>
                </div>
                <button type="submit" class="btn btn-success btn-sm">Submit Feedback</button>
              </form>
            </div>
          </div>

          <!-- Existing feedback -->
          <div class="card" th:if="${complaint.feedback != null}">
            <div class="card-header"><h3>Your Feedback</h3></div>
            <div class="card-body">
              <div class="star-display"
                   th:text="${'★'.repeat(complaint.feedback.rating) + '☆'.repeat(5 - complaint.feedback.rating)}"></div>
              <p style="font-size:.875rem;margin-top:.5rem" th:text="${complaint.feedback.comment}"></p>
              <div style="font-size:.75rem;color:#64748b;margin-top:.35rem"
                   th:text="${'Submitted on ' + #temporals.format(complaint.feedback.submittedAt,'dd MMM yyyy')}"></div>
            </div>
          </div>
        </div>

        <!-- Right column -->
        <div style="display:flex;flex-direction:column;gap:1rem">

          <!-- AI Analysis -->
          <div class="ai-box" th:if="${complaint.aiAnalysisExplanation != null}">
            <div class="ai-box-title">🤖 AI Analysis</div>
            <div class="ai-predictions">
              <div class="ai-pred-item">
                <div class="ai-pred-label">Category</div>
                <div class="ai-pred-value" th:text="${complaint.aiPredictedCategory}">—</div>
              </div>
              <div class="ai-pred-item">
                <div class="ai-pred-label">Priority</div>
                <div class="ai-pred-value" th:text="${complaint.aiPredictedPriority}">—</div>
                <div class="ai-confidence"
                     th:text="${complaint.aiConfidenceScore != null ? 'Confidence: ' + #numbers.formatDecimal(complaint.aiConfidenceScore * 100, 1, 0) + '%' : ''}"></div>
              </div>
            </div>
            <div class="ai-explanation" th:text="${complaint.aiAnalysisExplanation}"></div>
          </div>

          <!-- Status History -->
          <div class="card">
            <div class="card-header"><h3>Status Timeline</h3></div>
            <div class="card-body">
              <div class="timeline">
                <div class="timeline-item" th:each="h : ${complaint.statusHistory}">
                  <div class="timeline-dot"></div>
                  <div class="timeline-meta"
                       th:text="${#temporals.format(h.changedAt,'dd MMM yyyy, HH:mm') + ' by ' + h.changedByName}"></div>
                  <div class="timeline-content">
                    <span th:replace="~{fragments/layout :: statusBadge(${h.newStatus})}"></span>
                    <span th:if="${h.notes != null and !#strings.isEmpty(h.notes)}"
                          style="font-size:.8rem;color:#64748b;display:block;margin-top:.25rem"
                          th:text="${h.notes}"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
