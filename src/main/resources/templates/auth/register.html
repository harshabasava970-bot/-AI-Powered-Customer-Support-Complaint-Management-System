<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Register — SupportPortal</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="public-wrapper">
  <div class="auth-card" style="max-width:480px">
    <div class="brand-logo">
      <div class="logo-icon">🎧</div>
      <div class="logo-text">SupportPortal AI</div>
    </div>
    <h1>Create account</h1>
    <p>Register as a customer to submit complaints</p>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/register}" method="post" th:object="${registerRequest}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input th:field="*{firstName}" type="text" class="form-control"
                 th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''"
                 placeholder="First name"/>
          <div class="invalid-feedback" th:errors="*{firstName}"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input th:field="*{lastName}" type="text" class="form-control"
                 th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''"
                 placeholder="Last name"/>
          <div class="invalid-feedback" th:errors="*{lastName}"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input th:field="*{username}" type="text" class="form-control"
               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
               placeholder="Choose a username"/>
        <div class="invalid-feedback" th:errors="*{username}"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input th:field="*{email}" type="email" class="form-control"
               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
               placeholder="your@email.com"/>
        <div class="invalid-feedback" th:errors="*{email}"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Phone (optional)</label>
        <input th:field="*{phone}" type="text" class="form-control" placeholder="+1 234 567 890"/>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input th:field="*{password}" type="password" class="form-control"
               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
               placeholder="At least 8 characters"/>
        <div class="invalid-feedback" th:errors="*{password}"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input th:field="*{confirmPassword}" type="password" class="form-control"
               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
               placeholder="Repeat password"/>
        <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
        Create Account
      </button>
    </form>

    <p style="text-align:center;margin-top:1.25rem;font-size:.875rem;color:#64748b">
      Already have an account? <a th:href="@{/login}">Sign in</a>
    </p>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
