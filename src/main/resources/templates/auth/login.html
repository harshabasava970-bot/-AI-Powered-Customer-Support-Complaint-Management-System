<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login — SupportPortal</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="public-wrapper">
  <div class="auth-card">
    <div class="brand-logo">
      <div class="logo-icon">🎧</div>
      <div class="logo-text">SupportPortal AI</div>
    </div>
    <h1>Welcome back</h1>
    <p>Sign in to your account</p>

    <div th:if="${loginError}"   class="alert alert-danger"   th:text="${loginError}"></div>
    <div th:if="${logoutMessage}" class="alert alert-success" th:text="${logoutMessage}"></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input id="username" name="username" type="text" class="form-control"
               placeholder="Enter your username" required autofocus/>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" name="password" type="password" class="form-control"
               placeholder="Enter your password" required/>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem">
        Sign In
      </button>
    </form>

    <p style="text-align:center;margin-top:1.25rem;font-size:.875rem;color:#64748b">
      Don't have an account?
      <a th:href="@{/register}">Create one</a>
    </p>
    <p style="text-align:center;margin-top:.5rem;font-size:.75rem;color:#94a3b8">
      <em>Demo admin: admin / Admin@1234</em>
    </p>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
