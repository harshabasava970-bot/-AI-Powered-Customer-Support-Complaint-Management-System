spring.application.name=support-system
server.port=${PORT:8080}
server.address=0.0.0.0

# ── Database ──────────────────────────────────────────────────
# Production: set DB_TYPE=mysql in environment to use MySQL
# Default (Render free tier): H2 in-memory so app always starts
spring.datasource.url=${DB_URL:jdbc:h2:mem:supportdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false

# H2 console (disabled in prod)
spring.h2.console.enabled=false

# Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Logging
logging.level.com.supportportal=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
